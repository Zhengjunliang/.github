name: Task
description: Work that changes no behaviour, such as maintenance, tooling, documents or a decision.
labels: ["task"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What exists today and why it needs work, with a path, a link or a fact someone can check.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What is true once this is done.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: A list of checks, each provable by a command, a test or a screenshot. No checkboxes.
    validations:
      required: true
